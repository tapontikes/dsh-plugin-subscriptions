# dsh 0.2.0-rc.2 packaging gap: these prerelease packages import their runtime
# dependencies but declare none, so Node cannot resolve them under pnpm's
# strict layout when a spec server-renders a client component. The 0.1.x line
# declared the primitives set; this restores it (plus the store's own imports).
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.0-rc.2
      '@deepseek-ai/dsh-util-code-language': 0.2.0-rc.2
      '@deepseek-ai/dsh-util-workspace-path': 0.2.0-rc.2
      '@shikijs/langs': ^4.4.3
      '@types/mdast': ^4.0.4
      anser: ^2.3.5
      clsx: ^2.1.1
      diff: ^8.0.0
      katex: ^0.16.47
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-core-commonmark: ^2.0.3
      micromark-extension-gfm: ^3.0.0
      micromark-extension-math: ^3.1.0
      micromark-factory-space: ^2.0.1
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-sanitize-uri: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-util-types: ^2.0.2
      shiki: ^4.4.3
      simple-icons: ^16.0.0
  '@deepseek-ai/dsh-client-store':
    dependencies:
      immer: ^11.1.18
      zustand: ^5.0.15
